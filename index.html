<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綜藝👍級棒 - 系統目錄</title>
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #FCFAF2; color: #2D3436; padding-bottom: 80px; }
        .header-main { background-color: #F08300; color: white; letter-spacing: 0.15em; box-shadow: 0 4px 0px #C86000; }
        .left-header-blue { background-color: #2EA9DF; color: white; }
        .left-sub-blue { background-color: #A0D8EF; color: #005C85; }
        .bonus-header { background-color: #E95295; color: white; }
        .bonus-text { color: #C70067; }
        .rating-purple-header { background-color: #6F599C; color: white; }
        .rating-bg-light { background-color: #F3F0F9; }
        .menu-header { background-color: #2EA9DF; color: white; letter-spacing: 0.1em;}
        .menu-category { background-color: #7DB9DE; color: #FFFFFF; font-weight: bold; }
        .menu-link { color: #1B813E; font-weight: 500; text-decoration: none; transition: all 0.2s; padding: 4px 8px; border-radius: 4px; cursor: pointer; display: inline-block; }
        .menu-link:hover, .menu-link.active { color: #F08300; background-color: rgba(240, 131, 0, 0.08); }
        .search-panel { background-color: #FFFFFF; border: 2px solid #2EA9DF; border-radius: 8px; overflow: hidden; margin-top: 10px; transition: all 0.3s ease; }
        .search-header { background-color: #E6F4F1; color: #2D3436; font-weight: bold; }
        .result-table { table-layout: fixed; width: 100%; }
        .result-table th { background-color: #E2E8F0; color: #2D3436; font-size: 0.8rem; padding: 4px 4px; vertical-align: middle; border: 1px solid #CBD5E0; font-weight: bold; text-align: center; line-height: 1.1; height: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; }
        .result-table td { padding: 6px 4px; font-size: 0.9rem; border: 1px solid #E2E8F0; vertical-align: top; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
        .result-table tr:hover { background-color: #FFF9E5; }
        .link-cell { color: #2980b9; text-decoration: underline; font-weight: bold; }
        .header-small { display: block; font-size: 0.65rem; color: #666; transform: scale(0.95); font-weight: normal; }
        .card-shadow { box-shadow: 0 2px 5px rgba(0,0,0,0.08); border-radius: 6px; border: 1px solid #E5E5E5; }
        .font-compact { letter-spacing: -0.02em; }
        .browser-frame-container { border: 2px solid #A0D8EF; border-radius: 6px; overflow: hidden; background: white; height: 350px; display: flex; flex-direction: column; }
        .browser-toolbar { background: #E1F5FE; padding: 4px 8px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #B3E5FC; height: 32px; }
        .browser-title { font-weight: bold; color: #0277BD; font-size: 0.8rem; display: flex; align-items: center; gap: 4px; }
        .browser-actions { display: flex; gap: 4px; }
        .browser-btn { color: #0288D1; cursor: pointer; transition: all 0.2s; padding: 2px; font-size: 0.8rem; }
        .browser-btn:hover { color: #01579B; background-color: rgba(255,255,255,0.5); border-radius: 4px; }
        .browser-iframe { border: none; background: white; position: absolute; top: 0; left: 0; }
        .browser-content-wrapper { flex: 1; width: 100%; height: 100%; overflow: hidden; position: relative; }
        .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(0, 0, 0, 0.8); color: white; padding: 10px 20px; border-radius: 5px; font-size: 1rem; z-index: 9999; opacity: 0; transition: opacity 0.3s ease-in-out; pointer-events: none; }
        .toast.show { opacity: 1; }
        .cell-popup { position: fixed; z-index: 50; background: white; border: 1px solid #ccc; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-radius: 6px; padding: 10px; max-width: 300px; word-wrap: break-word; white-space: pre-wrap; font-size: 0.9rem; color: #333; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        /* 鎖定左側展開欄位的 CSS */
        .sticky-col-header { position: sticky; left: 0; z-index: 10; background-color: #F3F4F6; }
        .sticky-col { position: sticky; left: 0; z-index: 10; background-color: white; border-right: 1px solid #E2E8F0; }
        .result-table tr:hover .sticky-col { background-color: #FFF9E5; }
        .row-expanded { background-color: #fff7ed !important; }
        .row-expanded .sticky-col { background-color: #fff7ed !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const getText = (val) => (val && typeof val === 'object' && val.t) ? val.t.toString() : (val ? val.toString() : "");
        
        const getRemakeStyle = (val) => {
            const text = getText(val);
            if (["大棠", "吉馬家", "奇歌", "金光", "ACMA", "無", "*MPA"].some(k => text.includes(k))) return "bg-red-50 text-red-600 font-bold";
            if (text.includes("MPA")) return "text-orange-500 font-bold";
            if (["豪記", "TMCA", "時藝", "動脈", "放音樂", "穩盈", "華特", "公版", "林垂立"].includes(text)) return "text-green-600 font-bold";
            return "";
        };

        const isRedRemake = (val) => {
            const text = getText(val);
            return ["大棠", "吉馬家", "奇歌", "金光", "ACMA", "無", "*MPA"].some(k => text.includes(k));
        };

        const isMedley45 = (val) => {
            return getText(val).includes("45轉");
        };

        const getMPAStyle = (val) => {
            const text = getText(val);
            if (text === "無收費") return "bg-red-500 text-white font-bold px-1 rounded";
            return "";
        };

        const formatForExcel = (val) => {
            const str = getText(val);
            if (!str) return "";
            if (str.includes('\n') || str.includes('\r') || str.includes('\t') || str.includes('"')) {
                return `"${str.replace(/"/g, '""')}"`;
            }
            return str;
        };

        const ResultTable = ({ headers, data, enableCopy, remakeColIndex, mpaColIndex, medleyColIndex, enableRowSelection, hiddenColumnsInCopy, defaultColumnSelection, expandedRowRender, isRowExpandable, autoWidth, exactWidth }) => {
            const [copyMode, setCopyMode] = useState(false);
            const [selectedCols, setSelectedCols] = useState([]);
            const [selectedRows, setSelectedRows] = useState(new Set());
            const [showToast, setShowToast] = useState(false);
            const [filterRemake, setFilterRemake] = useState(false);
            const [filterMedley, setFilterMedley] = useState(false);
            const [popup, setPopup] = useState(null);
            const [expandedRows, setExpandedRows] = useState(new Set());

            useEffect(() => {
                if (copyMode) {
                    const allIndices = headers.map((_, i) => i);
                    const visibleIndices = allIndices.filter(i => !(hiddenColumnsInCopy || []).includes(i));
                    if (defaultColumnSelection === 'all') setSelectedCols(visibleIndices);
                    else setSelectedCols([]);
                    setSelectedRows(new Set());
                }
            }, [copyMode, headers, hiddenColumnsInCopy, defaultColumnSelection]);

            const getFilteredData = useCallback(() => {
                return data.filter(row => {
                    const rowData = Array.isArray(row) ? row : (row.cells || []);
                    if (filterRemake && remakeColIndex !== undefined && isRedRemake(rowData[remakeColIndex])) return false;
                    if (filterMedley && medleyColIndex !== undefined && isMedley45(rowData[medleyColIndex])) return false;
                    return true;
                });
            }, [data, filterRemake, remakeColIndex, filterMedley, medleyColIndex]);

            const handleCopy = useCallback(() => {
                let filteredData = getFilteredData();
                if (copyMode && enableRowSelection && selectedRows.size > 0) {
                    filteredData = filteredData.filter((_, index) => selectedRows.has(index));
                }
                if (filteredData.length === 0 || selectedCols.length === 0) return;
                const text = filteredData.map(row => {
                    const rowData = Array.isArray(row) ? row : row.cells;
                    return rowData.filter((_, i) => selectedCols.includes(i)).map(cell => formatForExcel(cell)).join('\t')
                }).join('\n');
                navigator.clipboard.writeText(text).then(() => { setShowToast(true); setTimeout(() => setShowToast(false), 2000); setCopyMode(false); });
            }, [copyMode, enableRowSelection, selectedRows, selectedCols, getFilteredData]);

            const toggleCol = (idx) => setSelectedCols(prev => prev.includes(idx) ? prev.filter(i => i !== idx) : [...prev, idx]);
            const toggleRow = (idx) => setSelectedRows(prev => { const newSet = new Set(prev); if (newSet.has(idx)) newSet.delete(idx); else newSet.add(idx); return newSet; });
            const toggleRowExpand = (idx) => setExpandedRows(prev => { const newSet = new Set(prev); if (newSet.has(idx)) newSet.delete(idx); else newSet.add(idx); return newSet; });
            const selectAllCols = () => setSelectedCols(headers.map((_, i) => i).filter(i => !(hiddenColumnsInCopy || []).includes(i)));
            const selectNoCols = () => setSelectedCols([]);
            
            const getTableWidthStyle = () => {
                if (exactWidth) {
                    let w = headers.reduce((sum, h) => sum + (parseInt(h.width) || 100), 0);
                    if (expandedRowRender) w += 32;
                    if (copyMode && enableRowSelection) w += 40;
                    return { width: w + 'px' };
                }
                if (autoWidth) return { width: 'max-content' };
                return {};
            };
            
            const displayData = getFilteredData();

            const handleCellClick = (e, cellData, isLink) => {
                if (isLink || copyMode) return;
                const content = (cellData && typeof cellData === 'object' && cellData.p) ? cellData.p : cellData;
                const rect = e.target.getBoundingClientRect();
                let left = rect.right + 5;
                const top = rect.top;
                if (left + 300 > window.innerWidth) left = rect.left - 310;
                setPopup({ content, x: left, y: top });
            };

            useEffect(() => { const closePopup = () => setPopup(null); if (popup) document.addEventListener('click', closePopup); return () => document.removeEventListener('click', closePopup); }, [popup]);

            return (
                <div className="relative">
                    {enableCopy && (
                        <div className="flex justify-between items-center mb-2">
                             <div className="flex gap-2">{copyMode && (<><button onClick={selectAllCols} type="button" className="text-xs bg-blue-100 hover:bg-blue-200 text-blue-700 px-2 py-1 rounded">全選</button><button onClick={selectNoCols} type="button" className="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-2 py-1 rounded">全不選</button></>)}</div>
                             <div className="flex gap-2">{!copyMode ? (<button onClick={() => setCopyMode(true)} type="button" className="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-1 rounded border border-gray-300 flex items-center"><i className="fas fa-clipboard mr-1"></i> 複製</button>) : (<><button onClick={handleCopy} type="button" className="text-xs bg-green-500 hover:bg-green-600 text-white px-2 py-1 rounded shadow flex items-center"><i className="fas fa-check mr-1"></i> 確認複製</button><button onClick={() => setCopyMode(false)} type="button" className="text-xs bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded shadow flex items-center"><i className="fas fa-times mr-1"></i> 取消</button></>)}</div>
                        </div>
                    )}
                    <div className="overflow-x-auto border border-gray-200 rounded">
                        <table className="result-table text-left border-collapse" style={getTableWidthStyle()}>
                            <thead>
                                {copyMode && (<tr className="bg-gray-50 border-b border-gray-200">{expandedRowRender && <th className="w-8 sticky-col-header"></th>}{enableRowSelection && <th className="w-10 p-1"></th>}{headers.map((_, i) => { if (hiddenColumnsInCopy && hiddenColumnsInCopy.includes(i)) return null;
                                return <th key={i} style={{width: headers[i].width}} className="text-center p-1"><input type="checkbox" checked={selectedCols.includes(i)} onChange={() => toggleCol(i)} className="cursor-pointer" /></th>;
                                })}</tr>)}
                                <tr>
                                    {expandedRowRender && <th className="w-8 text-center bg-gray-100 sticky-col-header"></th>}
                                    {copyMode && enableRowSelection && <th className="w-10 text-center bg-gray-100"><i className="fas fa-check-square text-gray-400"></i></th>}
                                    {headers.map((h, i) => { 
                                        if (copyMode && hiddenColumnsInCopy && hiddenColumnsInCopy.includes(i)) return null; 
                                        return (<th key={i} style={{width: h.width}}><div className="flex items-center justify-center gap-1">{typeof h.render === 'function' ? h.render() : (h.title || h.render)}{remakeColIndex === i && <button onClick={() => setFilterRemake(!filterRemake)} type="button" className={`ml-1 w-5 h-5 rounded-full flex items-center justify-center transition-colors ${filterRemake ? 'bg-red-500 text-white' : 'bg-gray-200 text-gray-500 hover:bg-gray-300'}`}><i className="fas fa-filter text-xs"></i></button>}{medleyColIndex === i && <button onClick={() => setFilterMedley(!filterMedley)} type="button" className={`ml-1 w-5 h-5 rounded-full flex items-center justify-center transition-colors ${filterMedley ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-500 hover:bg-gray-300'}`} title="過濾45轉"><i className="fas fa-filter text-xs"></i></button>}</div></th>);
                                })}</tr>
                            </thead>
                            <tbody>
                                {displayData.map((row, ri) => {
                                    const rowData = Array.isArray(row) ? row : row.cells;
                                    const isExpanded = expandedRows.has(ri);
                                    const canExpand = isRowExpandable ? isRowExpandable(row) : true;

                                    return (
                                        <React.Fragment key={ri}>
                                            <tr className={`${copyMode && enableRowSelection && selectedRows.has(ri) ? "bg-blue-50" : ""} ${isExpanded ? "row-expanded" : ""}`}>
                                                {expandedRowRender && (
                                                    <td className={`text-center w-8 sticky-col ${canExpand ? 'cursor-pointer hover:bg-orange-100 transition-colors' : ''}`} onClick={(e) => { if(canExpand) { e.stopPropagation(); toggleRowExpand(ri); } }}>
                                                        {canExpand && <i className={`fas fa-chevron-${isExpanded ? 'up' : 'down'} text-orange-500`}></i>}
                                                    </td>
                                                )}
                                                {copyMode && enableRowSelection && (<td className="text-center border-r border-gray-200"><input type="checkbox" checked={selectedRows.has(ri)} onChange={() => toggleRow(ri)} className="cursor-pointer w-4 h-4" /></td>)}
                                                {rowData.map((c, ci) => { 
                                                    if (copyMode && hiddenColumnsInCopy && hiddenColumnsInCopy.includes(ci)) return null; 
                                                    const displayContent = (c && typeof c === 'object' && c.t) ? c.t : c;
                                                    let styleClass = "";
                                                    if (ci === remakeColIndex) styleClass = getRemakeStyle(c); 
                                                    if (ci === mpaColIndex) styleClass = getMPAStyle(c);
                                                    const isLink = (typeof displayContent === 'string' && displayContent.startsWith('http')); 
                                                    
                                                    return (
                                                        <td key={ci} className={`${styleClass} cursor-pointer hover:bg-yellow-50 transition-colors`} onClick={(e) => { e.stopPropagation(); handleCellClick(e, c, isLink); }}>
                                                            {isLink ? <a href={displayContent} target="_blank" rel="noopener noreferrer" className="link-cell"><i className="fas fa-link mr-1 text-xs"></i>連結</a> : displayContent}
                                                        </td>
                                                    );
                                                })}
                                            </tr>
                                            {isExpanded && expandedRowRender && canExpand && (
                                                <tr>
                                                    <td colSpan={rowData.length + (expandedRowRender ? 1 : 0) + (copyMode && enableRowSelection ? 1 : 0)} className="p-0 border-0 bg-orange-50/20">
                                                        {expandedRowRender(row)}
                                                    </td>
                                                </tr>
                                            )}
                                        </React.Fragment>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                    <div className={`toast ${showToast ? 'show' : ''}`}>已複製</div>
                    {popup && (<div className="cell-popup animate-pulse" style={{ top: popup.y, left: popup.x, animation: 'none' }} onClick={(e) => e.stopPropagation()}><button onClick={() => setPopup(null)} className="absolute -top-2 -right-2 bg-gray-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow hover:bg-gray-600 focus:outline-none"><i className="fas fa-times"></i></button>{popup.content}</div>)}
                </div>
            );
        };

        const expandedRecordedHeaders = [{title:"集數",width:"50px"},{title:"播出日期",width:"90px"},{title:"單元",width:"150px"},{title:"歌名",width:"150px"},{title:"演唱者",width:"70px"},{title:"組曲",width:"40px"},{title:"錄影日期",width:"90px"},{title:"全集",width:"60px"},{title:"分段",width:"60px"},{title:"純享",width:"60px"}];
        const haojiHeaders = [{title:"位置",width:"80px"},{title:"歌名",width:"150px"},{title:"原唱人",width:"90px"},{title:"作詞人",width:"90px"},{title:"作曲人",width:"90px"},{title:"版權資訊",width:"140px"},{title:"首句歌詞",width:"160px"},{title:"備註",width:"100px"}];

        const UnifiedExpandedRow = ({ originalData }) => {
            const unsungSingers = originalData.songList
                .filter(r => {
                    const rowData = Array.isArray(r) ? r : r.cells;
                    return getText(rowData[0]).trim() === "";
                })
                .map(r => {
                    const rowData = Array.isArray(r) ? r : r.cells;
                    return getText(rowData[2]).trim();
                })
                .filter(Boolean);
            const unsungSingersText = [...new Set(unsungSingers)].join(".");
            
            // 若無未唱名單，則不顯示整個歌單區塊
            const shouldShowSongList = originalData.songList.length > 0 && unsungSingersText.trim() !== "";

            // 只取前 10 欄進行顯示，把第 11 欄(原唱)過濾掉
            const processedRecorded = originalData.recorded.map(r => {
                const row = Array.isArray(r) ? [...r] : [...r.cells];
                while(row.length < 10) row.push("-");
                return row.slice(0, 10);
            });

            return (
                <div className="flex flex-col gap-4 p-4 pl-5 border-l-4 border-orange-400 m-2 shadow-sm rounded-r bg-white">
                    <div className="flex flex-col gap-4 items-start w-max max-w-full">
                        {processedRecorded.length > 0 && (
                            <div className="bg-white rounded shadow-sm border border-gray-200 overflow-hidden overflow-x-auto w-max max-w-full">
                                <div className="bg-green-100 px-3 py-1.5 font-bold text-green-800 text-sm flex items-center gap-2 border-b border-green-200">
                                    <i className="fas fa-check-circle"></i> 已錄曲目紀錄 <span className="bg-green-600 text-white text-xs px-2 rounded-full ml-auto">{processedRecorded.length}</span>
                                </div>
                                <ResultTable headers={expandedRecordedHeaders} data={processedRecorded} enableCopy={false} exactWidth={true} />
                            </div>
                        )}

                        {shouldShowSongList && (
                            <div className="bg-white rounded shadow-sm border border-gray-200 overflow-hidden overflow-x-auto w-max max-w-full">
                                <div className="bg-blue-100 px-3 py-1.5 font-bold text-blue-800 text-sm flex items-center gap-2 border-b border-blue-200">
                                    <i className="fas fa-list"></i> 歌單紀錄 <span className="bg-blue-600 text-white text-xs px-2 rounded-full ml-auto">{originalData.songList.length}</span>
                                </div>
                                <table className="result-table text-left border-collapse" style={{ width: 'max-content' }}>
                                    <thead>
                                        <tr>
                                            <th style={{ width: '150px' }} className="bg-gray-100 text-center">開過未唱過</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td className="text-center font-bold text-blue-700 bg-blue-50/50 p-2 hover:bg-blue-100 transition-colors">
                                                {unsungSingersText}
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- 將搜尋邏輯移至前端 (Client-Side Search) 極速版 ---
        const handleSearchMemory = (db, type, q1, opt) => {
            const k1 = q1 ? q1.toString().toLowerCase().trim() : "";
            if (!k1 && type !== 'special') return []; 
            let data = [];
            
            const fmt = (v) => { if(v && Object.prototype.toString.call(v)==='[object Date]') return (v.getMonth()+1)+"/"+v.getDate(); return v; };
            const fmtFull = (v) => { if(v && Object.prototype.toString.call(v)==='[object Date]') return v.getFullYear()+"/"+(v.getMonth()+1)+"/"+v.getDate(); return v; };

            const match = (r, idx = -1) => {
                if (k1) {
                    if (idx >= 0) { if (!r[idx] || !r[idx].toString().toLowerCase().includes(k1)) return false; }
                    else { if (!r.some(c => c && c.toString().toLowerCase().includes(k1))) return false; }
                }
                return true;
            };

            if (type === 'unified') {
                return {
                    copyright: handleSearchMemory(db, 'copyright', q1, opt),
                    recorded: handleSearchMemory(db, 'recorded', q1, opt),
                    songList: handleSearchMemory(db, 'songList', q1, opt)
                };
            }

            if (type === 'copyright') {
                const hData = db.epSingers_A_Z;
                const hMap = new Map();
                hData.forEach(r => {
                    if (r[1]) hMap.set((r[1].toString() + "_" + (r[2]||"").toString()).replace(/\s/g, ""), { c: r[0], s: r[25] });
                });
                
                const sData = db.copyright_A_Q.map(r => r.slice(1)); 
                const res = sData.filter(r => match(r, 0));
                data = res.map(r => {
                    const k = (r[0].toString() + "_" + (r[4]||"").toString()).replace(/\s/g, "");
                    const h = hMap.get(k);
                    return [h ? h.c : "無", h ? h.s : "", ...r];
                });
            }
            else if (type === 'singerList' || type === 'songList') {
                const dRaw = db.copyright_A_Q.map(r => r.slice(1));
                const dMap = new Map();
                dRaw.forEach(r => {
                    dMap.set((r[0].toString() + "_" + (r[4]||"").toString()).replace(/\s/g, ""), { r: r[1], m: r[2], l: r[3], o: r[4], k: r[5], n: r[6] });
                });
                
                const raw = db.singerList_A_E;
                const targetIdx = (type === 'songList') ? 3 : 2;
                data = raw.filter(r => {
                    if (!match(r, targetIdx)) return false;
                    if (opt === true && r[0] && r[0].toString().trim() !== "") return false;
                    return true;
                }).map(r => {
                    const newR1 = fmt(r[1]);

            const isSingerMatch = (s1, s2) => {
                const c1 = (s1 || "").toString().replace(/[\s\-]/g, '').toLowerCase(); 
                const c2 = (s2 || "").toString().replace(/[\s\-]/g, '').toLowerCase();
                
                // 嚴格比對：雙方皆空白才相符
                if (!c1 && !c2) return true; 
                if (!c1 || !c2) return false;
                
                if (c1 === c2) return true;

                    cells: row,

            const unifiedSearch = useLocalSearch(fullDB, isDbLoading, 'unified', processUnifiedResults);
            const singerList = useLocalSearch(fullDB, isDbLoading, 'singerList'); 
            const epQuery = useLocalSearch(fullDB, isDbLoading, 'ep');
            const singerSung = useLocalSearch(fullDB, isDbLoading, 'singerSung'); 
            const origSinger = useLocalSearch(fullDB, isDbLoading, 'origSinger');
            const special = useLocalSearch(fullDB, isDbLoading, 'special');
            const haojiQuery = useLocalSearch(fullDB, isDbLoading, 'haoji'); 
            
            const [singerExcludeSung, setSingerExcludeSung] = useState(false);
            
            const togglePanelVisibility = (key) => setPanels(prev => { 
                if(prev[key].visible){ 
                    if(key==='unified')unifiedSearch.clear(); 
                    else if(key==='singerList')singerList.clear(); 
                    else if(key==='epQuery')epQuery.clear(); 
                    else if(key==='singerSungQuery')singerSung.clear(); 
                    else if(key==='origSingerQuery')origSinger.clear(); 
                    else if(key==='specialQuery')special.clear(); 
                    else if(key==='haojiQuery')haojiQuery.clear(); 
                } 
                return {...prev,[key]:{...prev[key],visible:!prev[key].visible,collapsed:false}}; 
            });
            const togglePanelCollapse = (key) => setPanels(prev => ({...prev,[key]:{...prev[key],collapsed:!prev[key].collapsed}}));
            
            const handleSingerCheckboxChange = (e) => { const checked = e.target.checked; setSingerExcludeSung(checked); if(singerList.term) singerList.search(singerList.term, checked); };
            
            return (
                <div className="max-w-6xl mx-auto p-3 min-h-screen">
                    <div className="header-main text-center py-2 text-xl font-bold rounded-lg mb-3">綜藝👍級棒</div>
                    <div className="flex flex-col md:flex-row gap-3 items-start">
                        <div className="w-full md:w-[28%] flex flex-col gap-3">
                            <div className="bg-white rounded-lg overflow-hidden card-shadow"><div className="left-header-blue text-center font-bold py-1 text-sm tracking-wider">今日</div><div className="bg-white py-2 flex justify-center items-center gap-2">{isLoadingInfo?<span className="text-gray-400 animate-pulse">...</span>:<><span className="text-xl font-bold text-gray-800 font-compact">{infoData?.today?.date || '-'}</span><span className="text-lg font-medium text-gray-500 font-compact">{infoData?.today?.day || '-'}</span></>}</div><div className="left-header-blue text-center font-bold py-1 text-sm tracking-wider border-t border-white/20">下次錄影</div><div className="bg-white py-2 flex justify-center items-center gap-2">{isLoadingInfo?<span className="text-gray-400 animate-pulse">...</span>:<><span className="text-xl font-bold text-gray-800 font-compact">{infoData?.nextRecord?.date || '-'}</span><span className="text-lg font-medium text-gray-500 font-compact">{infoData?.nextRecord?.day || '-'}</span></>}</div><div className="left-header-blue text-center font-bold py-1 text-sm tracking-wider border-t border-white/20">剩餘天數</div><div className="bg-white py-2 text-center">{isLoadingInfo?<span className="text-gray-400 animate-pulse">-</span>:<span className="text-3xl font-bold text-gray-800 font-compact">{infoData?.nextRecord?.daysLeft || '-'}</span>}</div></div>
                            <div className="bg-white rounded-lg overflow-hidden card-shadow">{(infoData?.broadcast || []).map((item,idx)=>(<div key={idx} className="flex border-b last:border-0 border-gray-100"><div className="left-header-blue w-1/3 flex items-center justify-center text-xs font-bold p-2 whitespace-pre-line leading-relaxed">{item?.title || '-'}</div><div className="w-1/3 flex items-center justify-center font-bold text-base text-gray-700 border-r border-gray-100 bg-white">{item?.date || '-'}</div><div className="w-1/3 flex items-center justify-center text-gray-600 font-bold text-base bg-white">{item?.days || '-'}</div></div>))}</div>
                            <div className="bg-white rounded-lg overflow-hidden card-shadow text-center"><div className="left-sub-blue font-bold py-2 text-base">本週播出</div><div className="bg-white p-3 border-t border-gray-100"><div className="flex flex-row justify-center items-center gap-2"><span className="bg-gray-100 text-gray-800 px-2 py-0.5 rounded font-bold text-lg border border-gray-200">{infoData?.weekEp?.ep || '-'}</span><span className="font-bold text-gray-700 text-sm text-left">{infoData?.weekEp?.title || '-'}</span></div></div></div>
                            <div className="border border-purple-200 rounded-lg overflow-hidden card-shadow"><div className="rating-purple-header text-center font-bold py-1 text-base">A4+前五</div><div className="rating-bg-light p-2 space-y-1">{(ratingData?.a4 || []).map((row,idx)=>(<div key={idx} className="flex text-sm items-center border-b border-gray-200/60 pb-1 last:border-0 last:pb-0"><div className="w-6 font-bold text-purple-700 text-center shrink-0 text-base font-compact">{row?.rank || '-'}</div><div className="flex-1 whitespace-pre-line leading-tight text-gray-700 px-2 text-xs font-medium">{row?.name || '-'}</div><div className="w-10 text-right font-bold text-gray-600 text-sm shrink-0 font-compact">{row?.rating || '-'}</div></div>))}</div></div>
                            <div className="border border-purple-200 rounded-lg overflow-hidden card-shadow"><div className="rating-purple-header text-center font-bold py-1 text-base">25-49前五</div><div className="rating-bg-light p-2 space-y-1">{(ratingData?.range2549 || []).map((row,idx)=>(<div key={idx} className="flex text-sm items-center border-b border-gray-200/60 pb-1 last:border-0 last:pb-0"><div className="w-6 font-bold text-purple-700 text-center shrink-0 text-base font-compact">{row?.rank || '-'}</div><div className="flex-1 whitespace-pre-line leading-tight text-gray-700 px-2 text-xs font-medium">{row?.name || '-'}</div><div className="w-10 text-right font-bold text-gray-600 text-sm shrink-0 font-compact">{row?.rating || '-'}</div></div>))}</div></div>
                            <div className="rounded-lg overflow-hidden card-shadow text-center border border-pink-200"><div className="bonus-header font-bold py-1.5 text-sm">上月可領撫慰金的集數</div><div className="bg-white py-1.5 font-bold text-2xl bonus-text font-compact">{infoData?.bonus?.lastMonth || '0'}</div><div className="bonus-header font-bold py-1.5 text-sm border-t border-white/20">本月可領撫慰金的集數</div><div className="bg-white py-1.5 font-bold text-2xl bonus-text font-compact">{infoData?.bonus?.thisMonth || '0'}</div></div>
                        </div>
                        <div className="w-full md:w-[72%] flex flex-col gap-3">
                            <div className="rounded-lg overflow-hidden bg-white card-shadow">
                                <div className="menu-header text-center font-bold py-2 text-lg">目錄</div>
                                <div className="flex flex-col bg-white">
                                    <div className="flex border-b border-gray-100 min-h-[50px]"><div className="menu-category w-24 flex items-center justify-center p-2 text-sm shrink-0">節目資訊</div><div className="flex-1 grid grid-cols-2 gap-2 p-2 items-center pl-4"><a href={links.program.schedule} target="_blank" className="menu-link text-sm">排播&收視</a><a href={links.program.icebing} target="_blank" className="menu-link text-sm">我愛冰冰SHOW</a></div></div>
                                    <div className="flex border-b border-gray-100 min-h-[50px]"><div className="menu-category w-24 flex items-center justify-center p-2 text-sm shrink-0">檔案下載</div><div className="flex-1 grid grid-cols-3 gap-2 p-2 items-center pl-4"><a href={links.download.authPublic} target="_blank" className="menu-link text-sm">公播公傳授權同意書</a><a href={links.download.authRemake} target="_blank" className="menu-link text-sm">重製授權同意書</a><a href={links.download.authPaidRemake} target="_blank" className="menu-link text-sm">付費重製授權書</a></div></div>
                                    <div className="flex border-b border-gray-100 min-h-[50px]"><div className="menu-category w-24 flex items-center justify-center p-2 text-sm shrink-0">版權相關</div><div className="flex-1 grid grid-cols-2 gap-2 p-2 items-center pl-4"><a href={links.copyright.member} target="_blank" className="menu-link text-sm">版權公司會員</a><a href={links.copyright.mpa} target="_blank" className="menu-link text-sm">MPA收費紀錄</a></div></div>
                                    <div className="flex min-h-[50px]"><div className="menu-category w-24 flex items-center justify-center p-2 text-sm shrink-0">各類查詢</div>
                                        <div className="flex-1 grid grid-cols-3 gap-2 p-2 items-center pl-4">
                                            <button onClick={()=>togglePanelVisibility('unified')} className={`menu-link text-sm text-left font-bold ${panels.unified.visible?'active text-orange-600':'text-gray-800'}`}><i className={`fas fa-search-plus mr-1 ${panels.unified.visible?'text-orange-500':'text-gray-500'}`}></i>綜合歌名查詢</button>
                                            <button onClick={()=>togglePanelVisibility('epQuery')} className={`menu-link text-sm text-left ${panels.epQuery.visible?'active':''}`}><i className={`fas fa-list-ol mr-1 ${panels.epQuery.visible?'text-orange-500':'text-gray-400'}`}></i>集數查詢</button>
                                            <button onClick={()=>togglePanelVisibility('singerList')} className={`menu-link text-sm text-left ${panels.singerList.visible?'active':''}`}><i className={`fas fa-microphone-alt mr-1 ${panels.singerList.visible?'text-orange-500':'text-gray-400'}`}></i>歌手歌單查詢</button>
                                            <button onClick={()=>togglePanelVisibility('singerSungQuery')} className={`menu-link text-sm text-left ${panels.singerSungQuery.visible?'active':''}`}><i className={`fas fa-user-tag mr-1 ${panels.singerSungQuery.visible?'text-orange-500':'text-gray-400'}`}></i>歌手已唱查詢</button>
                                            <button onClick={()=>togglePanelVisibility('origSingerQuery')} className={`menu-link text-sm text-left ${panels.origSingerQuery.visible?'active':''}`}><i className={`fas fa-star mr-1 ${panels.origSingerQuery.visible?'text-orange-500':'text-gray-400'}`}></i>建檔原唱查詢</button>
                                            <button onClick={()=>togglePanelVisibility('haojiQuery')} className={`menu-link text-sm text-left ${panels.haojiQuery.visible?'active':''}`}><i className={`fas fa-compact-disc mr-1 ${panels.haojiQuery.visible?'text-orange-500':'text-gray-400'}`}></i>豪記查詢</button>
                                            <button onClick={()=>togglePanelVisibility('specialQuery')} className={`menu-link text-sm text-left ${panels.specialQuery.visible?'active':''}`}><i className={`fas fa-bolt mr-1 ${panels.specialQuery.visible?'text-orange-500':'text-gray-400'}`}></i>特殊查詢</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-white rounded-lg overflow-hidden card-shadow mt-2">
                                <div className="p-3 flex justify-between items-center bg-[#2EA9DF] text-white font-bold text-lg"><div className="flex items-center gap-2"><i className="fas fa-globe"></i> 網頁查詢</div><button onClick={() => setPanels(prev => ({...prev, webQuery: { ...prev.webQuery, collapsed: !prev.webQuery.collapsed } }))} className="w-8 h-8 rounded-full hover:bg-white/20 flex items-center justify-center transition-colors focus:outline-none"><i className={`fas fa-chevron-${panels.webQuery.collapsed ? 'down' : 'up'}`}></i></button></div>
                                {!panels.webQuery.collapsed && (<div className="p-2 flex flex-col gap-2"><div className="flex justify-start"><a href={links.copyright.must} target="_blank" className="bg-orange-500 hover:bg-orange-600 text-white font-bold px-3 py-1 rounded text-sm inline-flex items-center shadow transition-colors"><i className="fas fa-music mr-2"></i> 前往 MÜST 著作權協會查詢</a></div><div className="grid grid-cols-1 md:grid-cols-2 gap-2">{embeddedSites.map((site, index) => <WebBrowser key={index} title={site.title} url={site.url} scale={site.scale} />)}</div></div>)}
                            </div>

                            {}
                            {panels.unified.visible && <div className="search-panel card-shadow border-orange-400 border-2"><div className="search-header p-3 flex justify-between items-center border-b border-orange-200 bg-orange-50"><div className="flex items-center gap-2"><i className="fas fa-search-plus text-orange-500 text-lg"></i><span className="font-bold text-orange-800">綜合歌名查詢 (版權 / 已錄 / 歌單)</span></div><div className="flex items-center gap-3"><a href={links.copyright.querySource} target="_blank" className="text-xs text-blue-500 hover:underline"><i className="fas fa-external-link-alt mr-1"></i>簡易版搜尋</a><button onClick={()=>togglePanelCollapse('unified')} className="w-6 h-6 rounded-full hover:bg-orange-200 flex items-center justify-center transition-colors focus:outline-none"><i className={`fas fa-chevron-${panels.unified.collapsed ? 'down' : 'up'} text-orange-500`}></i></button></div></div>{!panels.unified.collapsed && <div className="p-4 bg-white"><UnifiedSearchBlock hook={unifiedSearch} label="輸入歌名" headers={copyrightHeaders} enableCopy={true} remakeColIndex={3} mpaColIndex={4} /></div>}</div>}
                            
                            {panels.haojiQuery.visible && <div className="search-panel card-shadow"><div className="search-header p-3 flex justify-between items-center border-b border-gray-200"><div className="flex items-center gap-2"><i className="fas fa-compact-disc text-blue-500"></i><span>豪記查詢</span></div><div className="flex items-center gap-3"><a href={links.others.haojiQuerySource} target="_blank" className="text-xs text-blue-500 hover:underline"><i className="fas fa-external-link-alt mr-1"></i>開啟原始試算表</a><button onClick={()=>togglePanelCollapse('haojiQuery')} className="w-6 h-6 rounded-full hover:bg-gray-200 flex items-center justify-center transition-colors focus:outline-none"><i className={`fas fa-chevron-${panels.haojiQuery.collapsed ? 'down' : 'up'} text-gray-500`}></i></button></div></div>{!panels.haojiQuery.collapsed && <SimpleSearchPanel hook={haojiQuery} placeholder="請輸入豪記歌名..." headers={haojiHeaders} enableCopy={true} defaultColumnSelection="none" exactWidth={true} />}</div>}

                            {panels.epQuery.visible && <div className="search-panel card-shadow"><div className="search-header p-3 flex justify-between items-center border-b border-gray-200"><div className="flex items-center gap-2"><i className="fas fa-list-ol text-blue-500"></i><span>集數查詢</span></div><div className="flex items-center gap-3"><a href={links.others.epQuerySource} target="_blank" className="text-xs text-blue-500 hover:underline"><i className="fas fa-external-link-alt mr-1"></i>開啟原始試算表</a><button onClick={()=>togglePanelCollapse('epQuery')} className="w-6 h-6 rounded-full hover:bg-gray-200 flex items-center justify-center transition-colors focus:outline-none"><i className={`fas fa-chevron-${panels.epQuery.collapsed ? 'down' : 'up'} text-gray-500`}></i></button></div></div>{!panels.epQuery.collapsed && <SimpleSearchPanel hook={epQuery} placeholder="請輸入集數..." headers={epHeaders} enableCopy={true} defaultColumnSelection="none" remakeColIndex={7} mpaColIndex={8} medleyColIndex={5} />}</div>}
                            {panels.singerList.visible && <div className="search-panel card-shadow"><div className="search-header p-3 flex justify-between items-center border-b border-gray-200"><div className="flex items-center gap-2"><i className="fas fa-microphone-alt text-blue-500"></i><span>歌手歌單查詢</span></div><div className="flex items-center gap-3"><a href={links.others.singerListSource} target="_blank" className="text-xs text-blue-500 hover:underline"><i className="fas fa-external-link-alt mr-1"></i>開啟原始試算表</a><button onClick={()=>togglePanelCollapse('singerList')} className="w-6 h-6 rounded-full hover:bg-gray-200 flex items-center justify-center transition-colors focus:outline-none"><i className={`fas fa-chevron-${panels.singerList.collapsed ? 'down' : 'up'} text-gray-500`}></i></button></div></div>{!panels.singerList.collapsed && <SimpleSearchPanel hook={singerList} placeholder="請輸入歌手姓名..." headers={singerListHeaders} enableCopy={false} remakeColIndex={5} mpaColIndex={6} extraControl={<label className="flex items-center gap-2 cursor-pointer bg-gray-100 px-3 py-2 rounded border border-gray-300 hover:bg-gray-200 transition-colors select-none"><input type="checkbox" checked={singerExcludeSung} onChange={handleSingerCheckboxChange} className="w-4 h-4 text-orange-500 focus:ring-orange-400 cursor-pointer" /><span className="text-sm font-bold text-gray-700">排除已唱</span></label>} />}</div>}
                            {panels.singerSungQuery.visible && <div className="search-panel card-shadow"><div className="search-header p-3 flex justify-between items-center border-b border-gray-200"><div className="flex items-center gap-2"><i className="fas fa-user-tag text-blue-500"></i><span>歌手已唱查詢</span></div><div className="flex items-center gap-3"><a href={links.others.singerSungQuerySource} target="_blank" className="text-xs text-blue-500 hover:underline"><i className="fas fa-external-link-alt mr-1"></i>開啟原始試算表</a><button onClick={()=>togglePanelCollapse('singerSungQuery')} className="w-6 h-6 rounded-full hover:bg-gray-200 flex items-center justify-center transition-colors focus:outline-none"><i className={`fas fa-chevron-${panels.singerSungQuery.collapsed ? 'down' : 'up'} text-gray-500`}></i></button></div></div>{!panels.singerSungQuery.collapsed && <SimpleSearchPanel hook={singerSung} placeholder="請輸入歌手姓名..." headers={singerSungHeaders} enableCopy={false} remakeColIndex={7} mpaColIndex={8} medleyColIndex={5} />}</div>}
                            {panels.origSingerQuery.visible && <div className="search-panel card-shadow"><div className="search-header p-3 flex justify-between items-center border-b border-gray-200"><div className="flex items-center gap-2"><i className="fas fa-star text-blue-500"></i><span>建檔原唱查詢</span></div><div className="flex items-center gap-3"><a href={links.copyright.origQuerySource} target="_blank" className="text-xs text-blue-500 hover:underline"><i className="fas fa-external-link-alt mr-1"></i>開啟原始試算表</a><button onClick={()=>togglePanelCollapse('origSingerQuery')} className="w-6 h-6 rounded-full hover:bg-gray-200 flex items-center justify-center transition-colors focus:outline-none"><i className={`fas fa-chevron-${panels.origSingerQuery.collapsed ? 'down' : 'up'} text-gray-500`}></i></button></div></div>{!panels.origSingerQuery.collapsed && <SimpleSearchPanel hook={origSinger} placeholder="請輸入歌手..." headers={origSingerHeaders} enableCopy={true} remakeColIndex={1} mpaColIndex={2} />}</div>}
                            {panels.specialQuery.visible && <div className="search-panel card-shadow"><div className="search-header p-3 flex justify-between items-center border-b border-gray-200"><div className="flex items-center gap-2"><i className="fas fa-bolt text-blue-500"></i><span>特殊查詢</span></div><div className="flex items-center gap-3"><a href={links.others.epQuerySource} target="_blank" className="text-xs text-blue-500 hover:underline"><i className="fas fa-external-link-alt mr-1"></i>開啟原始試算表</a><button onClick={()=>togglePanelCollapse('specialQuery')} className="w-6 h-6 rounded-full hover:bg-gray-200 flex items-center justify-center transition-colors focus:outline-none"><i className={`fas fa-chevron-${panels.specialQuery.collapsed ? 'down' : 'up'} text-gray-500`}></i></button></div></div>{!panels.specialQuery.collapsed && <SpecialSearchPanel hook={special} headers={specialHeaders} enableCopy={false} remakeColIndex={3} mpaColIndex={4} />}</div>}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
